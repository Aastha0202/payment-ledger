spring:
  application:
    name: command-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_ledger
    username: aastha
    password: aastha
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      password: aastha
      timeout: 2000ms

server:
  port: 8081

logging:
  level:
    com.paymentledger: DEBUG
    org.flywaydb: INFO